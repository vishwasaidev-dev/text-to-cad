<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cad-mcp Modeler</title>
<style>
  :root {
    --bg:#0f1215; --panel:#161a1e; --panel-2:#1b2025; --edge:rgba(255,255,255,.08);
    --edge-2:rgba(255,255,255,.14); --text:#e7e4de; --muted:#8b939b; --faint:#5b636a;
    --accent:#d9a05b; --ok:#79b36f; --err:#d4674c; --info:#6ea5cf; --warn:#c9a227;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:ui-sans-serif,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:13px;}
  body{display:grid;grid-template-rows:auto 1fr auto;height:100vh;}
  button{font-family:inherit;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:0 12px;height:44px;
    background:var(--panel);border-bottom:1px solid var(--edge);}
  .brand{font-weight:700;letter-spacing:.02em;}
  .brand span{color:var(--accent);}
  .tb-group{display:flex;gap:4px;align-items:center;}
  .tb-sep{width:1px;height:22px;background:var(--edge);}
  .tb{padding:6px 10px;border-radius:6px;border:1px solid transparent;background:transparent;
    color:var(--muted);cursor:pointer;font-size:12.5px;white-space:nowrap;}
  .tb:hover{background:var(--panel-2);color:var(--text);}
  .tb:disabled{opacity:.35;cursor:default;background:transparent;color:var(--muted);}
  .tb.go{background:var(--ok);color:#0e1410;font-weight:700;border-color:transparent;}
  .tb.go:hover{filter:brightness(1.08);}
  .tb.go:disabled{opacity:.45;}
  .spacer{flex:1;}
  .chip{font-size:11px;padding:3px 9px;border-radius:100px;border:1px solid var(--edge-2);color:var(--muted);}
  .chip.live{border-color:var(--warn);color:var(--warn);}
  .chip.solid{border-color:var(--ok);color:var(--ok);}

  /* ---------- main 3 panes ---------- */
  .main{display:grid;grid-template-columns:272px 1fr 292px;min-height:0;}
  .pane{background:var(--panel);overflow-y:auto;overflow-x:hidden;}
  .pane.left{border-right:1px solid var(--edge);display:flex;flex-direction:column;}
  .pane.right{border-left:1px solid var(--edge);}
  .pane-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:9px 11px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--faint);border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--panel);z-index:2;}
  .pane-hd button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;
    line-height:1;padding:0 4px;border-radius:4px;}
  .pane-hd button:hover{color:var(--accent);}
  .pane-bd{padding:8px;flex:1;overflow-y:auto;}

  /* ---------- tree ---------- */
  .body-grp{margin-bottom:8px;border:1px solid var(--edge);border-radius:7px;overflow:hidden;}
  .body-hd{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--panel-2);cursor:pointer;}
  .body-hd.sel{background:rgba(217,160,91,.13);}
  .swatch{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.4);}
  .body-name{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .body-name input{width:100%;background:#0d1013;border:1px solid var(--accent);color:var(--text);
    border-radius:4px;padding:2px 5px;font-size:12.5px;font-family:inherit;}
  .icobtn{background:none;border:none;color:var(--faint);cursor:pointer;padding:2px 3px;
    font-size:12px;line-height:1;border-radius:4px;flex:none;}
  .icobtn:hover{color:var(--text);background:rgba(255,255,255,.07);}
  .icobtn.on{color:var(--accent);}
  .feat-list{padding:3px;}
  .feat{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:5px;cursor:pointer;
    font-size:12px;color:var(--muted);}
  .feat:hover{background:rgba(255,255,255,.05);color:var(--text);}
  .feat.sel{background:rgba(217,160,91,.18);color:var(--text);}
  .feat.supp .fname{opacity:.4;text-decoration:line-through;}
  .fico{width:15px;text-align:center;flex:none;font-size:11px;}
  .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fmode{font-size:9.5px;padding:1px 5px;border-radius:100px;flex:none;letter-spacing:.03em;}
  .fmode.add{color:var(--ok);border:1px solid rgba(121,179,111,.5);}
  .fmode.subtract{color:var(--err);border:1px solid rgba(212,103,76,.5);}
  .fmode.intersect{color:var(--info);border:1px solid rgba(110,165,207,.5);}
  .fpat{font-size:9.5px;color:var(--info);flex:none;}
  .hint{font-size:11.5px;color:var(--faint);padding:10px 4px;line-height:1.55;}

  /* ---------- add-feature palette ---------- */
  .palette{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px;border-top:1px solid var(--edge);
    background:var(--panel);}
  .palette button{padding:7px 4px;border-radius:6px;border:1px solid var(--edge);background:var(--panel-2);
    color:var(--muted);cursor:pointer;font-size:11.5px;}
  .palette button:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- viewport ---------- */
  .view{position:relative;background:#0b0e11;min-width:0;}
  #gl{display:block;width:100%;height:100%;cursor:grab;}
  #gl:active{cursor:grabbing;}
  .vp-tools{position:absolute;top:10px;left:10px;display:flex;gap:4px;flex-wrap:wrap;max-width:68%;}
  .vp-tools button{padding:4px 8px;font-size:11px;border-radius:5px;border:1px solid var(--edge);
    background:rgba(22,26,30,.85);color:var(--muted);cursor:pointer;backdrop-filter:blur(4px);}
  .vp-tools button:hover{color:var(--accent);border-color:var(--accent);}
  .vp-tools button.on{color:var(--accent);border-color:var(--accent);}
  .vp-legend{position:absolute;bottom:10px;left:12px;font:11px/1.7 ui-monospace,monospace;color:var(--faint);}
  .vp-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}
  .vp-hint{position:absolute;bottom:10px;right:12px;font:11px/1 ui-monospace,monospace;color:var(--faint);}

  /* ---------- property panel ---------- */
  .grp{border-bottom:1px solid var(--edge);padding:10px 11px;}
  .grp-t{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}
  label{display:block;font-size:11.5px;color:var(--muted);margin:8px 0 3px;}
  input[type=text],input[type=number],input[type=password],select,textarea{
    width:100%;background:#0d1013;border:1px solid var(--edge);color:var(--text);
    border-radius:5px;padding:6px 8px;font-size:12.5px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
  .r3 label,.r2 label{margin-top:0;}
  .r2{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .cbrow{display:flex;align-items:center;gap:7px;margin:7px 0;}
  .cbrow input{width:auto;accent-color:var(--accent);}
  .cbrow label{margin:0;color:var(--text);}
  .pills{display:flex;gap:4px;}
  .pills button{flex:1;padding:6px 0;border-radius:5px;border:1px solid var(--edge);
    background:#0d1013;color:var(--muted);font-size:11.5px;cursor:pointer;}
  .pills button.on{border-color:var(--accent);color:var(--accent);background:rgba(217,160,91,.1);}
  .btn-wide{width:100%;padding:8px;border-radius:6px;border:1px solid var(--edge);
    background:var(--panel-2);color:var(--muted);cursor:pointer;font-size:12px;margin-top:8px;}
  .btn-wide:hover{border-color:var(--accent);color:var(--accent);}
  .btn-wide.danger:hover{border-color:var(--err);color:var(--err);}
  .meas{font:11.5px/1.9 ui-monospace,monospace;color:var(--muted);}
  .meas b{color:var(--text);font-weight:600;}
  .dl{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .dl a{flex:1 1 45%;text-align:center;padding:6px;border-radius:5px;border:1px solid rgba(217,160,91,.45);
    color:var(--accent);text-decoration:none;font-size:11.5px;font-weight:600;}
  .dl a:hover{background:rgba(217,160,91,.1);}

  /* ---------- status bar ---------- */
  .status{display:flex;align-items:center;gap:10px;padding:0 12px;height:26px;background:var(--panel);
    border-top:1px solid var(--edge);font:11.5px/1 ui-monospace,monospace;color:var(--faint);}
  .status .msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .status .msg.ok{color:var(--ok);} .status .msg.err{color:var(--err);} .status .msg.busy{color:var(--accent);}

  /* ---------- modal / sketcher ---------- */
  .modal{position:fixed;inset:0;background:rgba(8,10,12,.82);backdrop-filter:blur(5px);
    display:none;align-items:center;justify-content:center;z-index:40;}
  .modal.open{display:flex;}
  .sk{background:var(--panel);border:1px solid var(--edge-2);border-radius:10px;width:min(960px,94vw);
    height:min(660px,92vh);display:flex;flex-direction:column;overflow:hidden;}
  .sk-hd{display:flex;align-items:baseline;gap:12px;padding:11px 14px;border-bottom:1px solid var(--edge);}
  .sk-hd h3{margin:0;font-size:14px;font-weight:600;}
  .sk-hd .sub{font-size:11.5px;color:var(--faint);}
  .sk-bd{display:grid;grid-template-columns:1fr 212px;min-height:0;flex:1;}
  .sk-canvas-wrap{position:relative;background:#0b0e11;min-width:0;}
  #skCanvas{display:block;width:100%;height:100%;}
  .sk-side{border-left:1px solid var(--edge);padding:11px;overflow-y:auto;}
  .sk-tools{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px;}
  .sk-tools button{padding:7px 4px;border-radius:5px;border:1px solid var(--edge);background:#0d1013;
    color:var(--muted);font-size:11.5px;cursor:pointer;}
  .sk-tools button.on{border-color:var(--accent);color:var(--accent);background:rgba(217,160,91,.1);}
  .sk-pts{font:11px/1.6 ui-monospace,monospace;color:var(--faint);max-height:140px;overflow-y:auto;
    border:1px solid var(--edge);border-radius:5px;padding:6px;margin-top:6px;}
  .sk-pts div{cursor:pointer;padding:1px 3px;border-radius:3px;}
  .sk-pts div:hover{background:rgba(255,255,255,.06);color:var(--text);}
  .sk-pts div.sel{background:rgba(217,160,91,.2);color:var(--accent);}
  .sk-ft{display:flex;gap:8px;justify-content:flex-end;padding:11px 14px;border-top:1px solid var(--edge);}
  .sk-ft button{padding:8px 18px;border-radius:6px;border:1px solid var(--edge);background:transparent;
    color:var(--muted);cursor:pointer;font-size:12.5px;}
  .sk-ft button.go{background:var(--accent);color:#12161a;font-weight:700;border-color:transparent;}
  .sk-readout{position:absolute;bottom:8px;left:10px;font:11px/1 ui-monospace,monospace;color:var(--faint);
    pointer-events:none;}

  /* ---------- auth ---------- */
  .gate{position:fixed;inset:0;background:rgba(8,10,12,.94);display:flex;align-items:center;
    justify-content:center;z-index:60;backdrop-filter:blur(6px);}
  .gate-box{background:var(--panel);border:1px solid var(--edge-2);border-radius:10px;padding:24px;width:330px;}
  .gate-box h2{margin:0 0 5px;font-size:15px;}
  .gate-box p{margin:0 0 14px;font-size:12px;color:var(--muted);line-height:1.5;}
  .gate-box button{width:100%;margin-top:10px;padding:9px;border-radius:6px;border:none;
    background:var(--accent);color:#12161a;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h2>cad-mcp Modeler</h2>
    <p>Enter the server's Bearer token (the <code>MCP_AUTH_TOKEN</code> from <code>switchgear/.mcp.json</code>).</p>
    <input type="password" id="tokenInput" placeholder="MCP_AUTH_TOKEN" autocomplete="off">
    <button onclick="saveToken()">Enter</button>
  </div>
</div>

<div class="topbar">
  <div class="brand">cad<span>&middot;</span>mcp</div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="tb" onclick="newDesign()">New</button>
    <button class="tb" onclick="exportDesign()">Export</button>
    <button class="tb" onclick="document.getElementById('importFile').click()">Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importDesign(event)">
    <button class="tb" onclick="document.getElementById('stepFile').click()" title="Preview an existing .step file (read-only, not editable here)">View STEP</button>
    <input type="file" id="stepFile" accept=".step,.stp" style="display:none" onchange="previewStepFile(event)">
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="tb" id="undoBtn" onclick="undo()" title="Ctrl+Z">&#8630; Undo</button>
    <button class="tb" id="redoBtn" onclick="redo()" title="Ctrl+Y">&#8631; Redo</button>
  </div>
  <div class="spacer"></div>
  <span class="chip" id="viewChip">layout preview</span>
  <button class="tb go" id="genBtn" onclick="generate()">Generate solid</button>
  <a class="tb" href="/ui" style="text-decoration:none">single-shape tool &rarr;</a>
</div>

<div class="main">
  <div class="pane left">
    <div class="pane-hd">
      <span>Model tree</span>
      <button onclick="addBody()" title="Add a body (separate part)">+</button>
    </div>
    <div class="pane-bd" id="tree"></div>
    <div class="palette" id="palette"></div>
  </div>

  <div class="view">
    <canvas id="gl"></canvas>
    <div class="vp-tools">
      <button onclick="setView('iso')">Iso</button>
      <button onclick="setView('front')">Front</button>
      <button onclick="setView('back')">Back</button>
      <button onclick="setView('left')">Left</button>
      <button onclick="setView('right')">Right</button>
      <button onclick="setView('top')">Top</button>
      <button onclick="setView('bottom')">Bottom</button>
      <button onclick="fitView()">Fit</button>
      <button id="gridBtn" class="on" onclick="toggleGrid()">Grid</button>
      <button id="spinBtn" onclick="toggleSpin()">Spin</button>
    </div>
    <div class="vp-legend" id="legend"></div>
    <div class="vp-hint">L-drag orbit &middot; R-drag pan &middot; scroll zoom &middot; F fit</div>
  </div>

  <div class="pane right">
    <div class="pane-hd"><span id="propTitle">Properties</span></div>
    <div id="props"></div>
  </div>
</div>

<div class="status">
  <span class="msg" id="statusMsg">Ready.</span>
  <span id="statCount"></span>
</div>

<div class="modal" id="skModal">
  <div class="sk">
    <div class="sk-hd">
      <h3 id="skTitle">Sketch profile</h3>
      <span class="sub" id="skSub"></span>
    </div>
    <div class="sk-bd">
      <div class="sk-canvas-wrap">
        <canvas id="skCanvas"></canvas>
        <div class="sk-readout" id="skReadout"></div>
      </div>
      <div class="sk-side">
        <div class="grp-t">Tool</div>
        <div class="sk-tools">
          <button id="tool-select" class="on" onclick="setTool('select')">Move</button>
          <button id="tool-poly" onclick="setTool('poly')">Polyline</button>
          <button id="tool-rect" onclick="setTool('rect')">Rectangle</button>
          <button id="tool-circle" onclick="setTool('circle')">Circle</button>
        </div>
        <div class="cbrow">
          <input type="checkbox" id="skSnap" checked onchange="skDraw()">
          <label for="skSnap">Snap to grid</label>
        </div>
        <label>Grid / snap step (mm)</label>
        <input type="number" id="skStep" value="1" min="0.1" max="20" step="0.1" onchange="skDraw()">
        <div class="grp-t" style="margin-top:14px">Selected point</div>
        <div class="r2">
          <div><label id="skXLabel">X</label><input type="number" id="skPX" step="0.5" onchange="skEditPoint()"></div>
          <div><label id="skYLabel">Y</label><input type="number" id="skPY" step="0.5" onchange="skEditPoint()"></div>
        </div>
        <button class="btn-wide" onclick="skDeleteSelected()">Delete point</button>
        <button class="btn-wide" onclick="skUndoPoint()">Undo last point</button>
        <button class="btn-wide danger" onclick="skClear()">Clear all</button>
        <div class="grp-t" style="margin-top:14px">Points (<span id="skCount">0</span>)</div>
        <div class="sk-pts" id="skPts"></div>
      </div>
    </div>
    <div class="sk-ft">
      <button onclick="closeSketch(false)">Cancel</button>
      <button class="go" onclick="closeSketch(true)">Apply profile</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   cad-mcp Modeler
   The 3D view is a LAYOUT preview built client-side: additive features render
   as material, subtract/intersect render as translucent ghosts. No CSG happens
   in the browser -- the true boolean solid always comes back from the server's
   OpenCASCADE kernel when you press Generate.
   ========================================================================== */

const SCHEMA = __FEATURE_SCHEMA_JSON__;

const TYPE_ICON = {box:"▢", rod:"▬", tube:"◎", link:"⑃", coil:"◍",
                   plate:"▤", sketch:"✎", revolve:"⟳", fillet:"◟", chamfer:"◺"};
const MODIFIER_TYPES = new Set(["fillet", "chamfer"]);
const BODY_COLORS = ["#8fbf9f","#d9a05b","#7fa8d0","#c98fa8","#a99ad6","#9fc07a","#d0925f","#7ec6c0"];
const DENSITIES = {Steel:7.85, Aluminium:2.70, Brass:8.50, Copper:8.96, "ABS plastic":1.04, Nylon:1.15};
const STORE_KEY = "cadmcp_design_v2";

let uid = 1;
const nid = () => "n" + (uid++);

let state = null;
let generated = null;
let undoStack = [], redoStack = [];
let authToken = sessionStorage.getItem("cadmcp_token") || "";

function defaultFeature(type) {
  const params = {};
  for (const [k, spec] of Object.entries(SCHEMA[type].params)) params[k] = spec[2];
  return {
    id: nid(), type, params,
    position: {x:0, y:0, z:0}, rotation: {rx:0, ry:0, rz:0},
    mode: "add", suppressed: false,
    pattern: {type:"none", count:3, dx:10, dy:0, dz:0, cx:0, cy:0, cz:0, angle:360},
  };
}
function defaultBody(i) {
  return {id:nid(), name:"Body " + (i + 1), color:BODY_COLORS[i % BODY_COLORS.length],
          visible:true, suppressed:false, features:[]};
}
function blankDesign() {
  const b = defaultBody(0);
  b.features.push(defaultFeature("box"));
  return {bodies:[b], selBody:b.id, selFeature:b.features[0].id, material:"Steel", filename:"model"};
}

const curBody = () => state.bodies.find(b => b.id === state.selBody) || state.bodies[0];
function curFeature() {
  for (const b of state.bodies) { const f = b.features.find(f => f.id === state.selFeature); if (f) return f; }
  return null;
}
const featureBody = (fid) => state.bodies.find(b => b.features.some(f => f.id === fid));
function featureById(fid) { for (const b of state.bodies) { const f = b.features.find(f => f.id === fid); if (f) return f; } return null; }

/* ------------------------------------------------------------- undo/redo -- */
const snapshot = () => JSON.stringify({bodies:state.bodies, selBody:state.selBody, selFeature:state.selFeature});
function pushUndo() { undoStack.push(snapshot()); if (undoStack.length > 60) undoStack.shift(); redoStack.length = 0; refreshUndoBtns(); }
function applySnap(s) { const o = JSON.parse(s); state.bodies = o.bodies; state.selBody = o.selBody; state.selFeature = o.selFeature; renderAll(); }
function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); applySnap(undoStack.pop()); refreshUndoBtns(); status("Undo."); }
function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); applySnap(redoStack.pop()); refreshUndoBtns(); status("Redo."); }
function refreshUndoBtns() {
  document.getElementById("undoBtn").disabled = !undoStack.length;
  document.getElementById("redoBtn").disabled = !redoStack.length;
}

/* ----------------------------------------------------------- persistence -- */
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!d || !Array.isArray(d.bodies) || !d.bodies.length) return null;
    let max = 0;
    for (const b of d.bodies) {
      max = Math.max(max, parseInt(String(b.id).slice(1)) || 0);
      for (const f of (b.features || [])) max = Math.max(max, parseInt(String(f.id).slice(1)) || 0);
    }
    uid = max + 1;
    return d;
  } catch (e) { return null; }
}
function newDesign() {
  if (!confirm("Discard the current model and start a new one?")) return;
  pushUndo(); state = blankDesign(); generated = null; markStale(); renderAll(); fitView(); status("New model.");
}
function exportDesign() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = (state.filename || "model") + ".cadmcp.json"; a.click();
  status("Design exported.");
}
function importDesign(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.bodies) || !d.bodies.length) throw new Error("no bodies in file");
      pushUndo(); state = d; generated = null;
      if (!state.bodies.some(b => b.id === state.selBody)) state.selBody = state.bodies[0].id;
      markStale(); renderAll(); fitView(); status("Imported " + file.name);
    } catch (e) { status("Import failed: " + e.message, "err"); }
  };
  r.readAsText(file); ev.target.value = "";
}

/* ---------------------------------------------------------------- auth ---- */
function saveToken() {
  authToken = document.getElementById("tokenInput").value.trim();
  if (!authToken) return;
  sessionStorage.setItem("cadmcp_token", authToken);
  document.getElementById("gate").style.display = "none";
}
if (authToken) document.getElementById("gate").style.display = "none";

/* -------------------------------------------------------------- status ---- */
let statusTimer = null;
function status(msg, cls) {
  const el = document.getElementById("statusMsg");
  el.textContent = msg; el.className = "msg " + (cls || "");
  clearTimeout(statusTimer);
  if (cls !== "busy") statusTimer = setTimeout(() => { el.textContent = "Ready."; el.className = "msg"; }, 7000);
}
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const countPts = (t) => String(t || "").split("\n").filter(s => s.trim()).length;

/* ======================================================= TREE ============== */
function renderTree() {
  const host = document.getElementById("tree");
  host.innerHTML = "";
  state.bodies.forEach((body) => {
    const grp = document.createElement("div");
    grp.className = "body-grp";

    const hd = document.createElement("div");
    hd.className = "body-hd" + (body.id === state.selBody ? " sel" : "");
    hd.onclick = (e) => { if (!/BUTTON|INPUT/.test(e.target.tagName)) selectBody(body.id); };
    hd.innerHTML =
      `<span class="swatch" style="background:${esc(body.color)}"></span>` +
      `<span class="body-name" ondblclick="renameBody('${body.id}',this)">${esc(body.name)}</span>` +
      `<button class="icobtn ${body.visible ? "on" : ""}" title="Show/hide" onclick="toggleBodyVis('${body.id}')">${body.visible ? "◉" : "○"}</button>` +
      `<button class="icobtn" title="Suppress body" onclick="toggleBodySupp('${body.id}')">${body.suppressed ? "⊘" : "⊙"}</button>` +
      (state.bodies.length > 1 ? `<button class="icobtn" title="Delete body" onclick="deleteBody('${body.id}')">✕</button>` : "");
    grp.appendChild(hd);

    const list = document.createElement("div");
    list.className = "feat-list";
    if (!body.features.length) {
      list.innerHTML = `<div class="hint">Empty body &mdash; add a feature from the palette below.</div>`;
    } else {
      body.features.forEach((f, fi) => {
        const row = document.createElement("div");
        row.className = "feat" + (f.id === state.selFeature ? " sel" : "") + (f.suppressed ? " supp" : "");
        row.onclick = (e) => { if (e.target.tagName !== "BUTTON") selectFeature(body.id, f.id); };
        const patterned = f.pattern && f.pattern.type !== "none" && f.pattern.count > 1;
        row.innerHTML =
          `<span class="fico">${TYPE_ICON[f.type] || "•"}</span>` +
          `<span class="fname">${esc(featLabel(f))}</span>` +
          (patterned ? `<span class="fpat">×${f.pattern.count}</span>` : "") +
          (fi === 0 ? "" : `<span class="fmode ${f.mode}">${esc(f.mode.slice(0,3))}</span>`) +
          `<button class="icobtn" title="Move up" onclick="moveFeat('${body.id}','${f.id}',-1)">↑</button>` +
          `<button class="icobtn" title="Move down" onclick="moveFeat('${body.id}','${f.id}',1)">↓</button>` +
          `<button class="icobtn" title="Suppress" onclick="toggleFeatSupp('${f.id}')">${f.suppressed ? "⊘" : "⊙"}</button>` +
          `<button class="icobtn" title="Delete" onclick="deleteFeat('${body.id}','${f.id}')">✕</button>`;
        list.appendChild(row);
      });
    }
    grp.appendChild(list);
    host.appendChild(grp);
  });
  const nf = state.bodies.reduce((n, b) => n + b.features.length, 0);
  document.getElementById("statCount").textContent = state.bodies.length + " bodies · " + nf + " features";
}
function featLabel(f) {
  const p = f.params, base = SCHEMA[f.type].label.split(" (")[0];
  switch (f.type) {
    case "box":     return `${base} ${p.length}×${p.width}×${p.height}`;
    case "rod":     return `${base} ⌀${(p.radius*2).toFixed(1)}×${p.length}`;
    case "tube":    return `${base} ⌀${(p.outer_radius*2).toFixed(1)}/${(p.inner_radius*2).toFixed(1)}`;
    case "link":    return `${base} L${p.length}`;
    case "plate":   return `${base} ${p.length}×${p.width}`;
    case "coil":    return `${base} L${p.length} ${p.turns}t`;
    case "sketch":  return `Sketch ${countPts(p.points)}pt ×${p.thickness}`;
    case "revolve": return `Revolve ${countPts(p.points)}pt ${p.angle}°`;
  }
  return base;
}

function selectBody(id) {
  state.selBody = id;
  const b = curBody();
  state.selFeature = b.features.length ? b.features[0].id : null;
  renderAll();
}
function selectFeature(bid, fid) { state.selBody = bid; state.selFeature = fid; renderAll(); }
function addBody() {
  pushUndo();
  const b = defaultBody(state.bodies.length);
  state.bodies.push(b); state.selBody = b.id; state.selFeature = null;
  markStale(); renderAll(); status("Body added — it builds as a separate part.");
}
function deleteBody(id) {
  if (state.bodies.length <= 1) return;
  pushUndo();
  state.bodies = state.bodies.filter(b => b.id !== id);
  if (state.selBody === id) {
    state.selBody = state.bodies[0].id;
    state.selFeature = state.bodies[0].features[0] ? state.bodies[0].features[0].id : null;
  }
  markStale(); renderAll();
}
function toggleBodyVis(id) { const b = state.bodies.find(b => b.id === id); b.visible = !b.visible; renderAll(); }
function toggleBodySupp(id) { pushUndo(); const b = state.bodies.find(b => b.id === id); b.suppressed = !b.suppressed; markStale(); renderAll(); }
function renameBody(id, span) {
  const b = state.bodies.find(b => b.id === id);
  const inp = document.createElement("input");
  inp.value = b.name; span.textContent = ""; span.appendChild(inp); inp.focus(); inp.select();
  let done = false;
  const finish = () => { if (done) return; done = true; pushUndo(); b.name = inp.value.trim() || b.name; markStale(); renderAll(); };
  inp.onblur = finish;
  inp.onkeydown = (e) => { if (e.key === "Enter") inp.blur(); if (e.key === "Escape") { done = true; renderAll(); } };
}
function addFeature(type) {
  const b = curBody();
  if (MODIFIER_TYPES.has(type) && !b.features.length) {
    status(SCHEMA[type].label + " needs a feature to modify — add a solid first.", "err");
    return;
  }
  pushUndo();
  const f = defaultFeature(type);
  b.features.push(f);
  state.selFeature = f.id;
  markStale(); renderAll();
  if (type === "sketch" || type === "revolve") openSketch();
  else status(SCHEMA[type].label + " added.");
}
function deleteFeat(bid, fid) {
  pushUndo();
  const b = state.bodies.find(b => b.id === bid);
  b.features = b.features.filter(f => f.id !== fid);
  if (state.selFeature === fid) state.selFeature = b.features.length ? b.features[0].id : null;
  markStale(); renderAll();
}
function moveFeat(bid, fid, dir) {
  const b = state.bodies.find(b => b.id === bid);
  const i = b.features.findIndex(f => f.id === fid), j = i + dir;
  if (j < 0 || j >= b.features.length) return;
  pushUndo();
  [b.features[i], b.features[j]] = [b.features[j], b.features[i]];
  markStale(); renderAll();
}
function toggleFeatSupp(fid) { pushUndo(); const f = featureById(fid); f.suppressed = !f.suppressed; markStale(); renderAll(); }

function vecInput(group, key, label, f) {

    oninput="setVec('${group}','${key}',parseFloat(this.value))"></div>`;

function setParam(name, val) { const f = curFeature(); if (!f) return; f.params[name] = val; touch(); }
function setVec(g, k, v) { const f = curFeature(); if (!f) return; f[g][k] = isNaN(v) ? 0 : v; touch(); }

  const f = curFeature(); if (!f) return;
  if (!f.pattern) f.pattern = {type:"none", count:3, dx:10, dy:0, dz:0, cx:0, cy:0, cz:0, angle:360};
  f.pattern[key] = val;

  b.features.splice(b.features.indexOf(f) + 1, 0, copy);

/* ================================================== MEASUREMENTS ========== */
function meshVolume(pos) {
  let v = 0;
  for (let i = 0; i < pos.length; i += 9) {
    const ax=pos[i],ay=pos[i+1],az=pos[i+2], bx=pos[i+3],by=pos[i+4],bz=pos[i+5], cx=pos[i+6],cy=pos[i+7],cz=pos[i+8];
    v += (ax*(by*cz-bz*cy) - ay*(bx*cz-bz*cx) + az*(bx*cy-by*cx)) / 6;
  }
  return Math.abs(v);
}
function bboxOf(pos) {
  const min=[Infinity,Infinity,Infinity], max=[-Infinity,-Infinity,-Infinity];
  for (let i = 0; i < pos.length; i += 3)
    for (let k = 0; k < 3; k++) { const v = pos[i+k]; if (v<min[k]) min[k]=v; if (v>max[k]) max[k]=v; }
  return {min, max};
}
function unionBox(list) {
  let bb = null;
  for (const m of list) {
    if (!m.pos.length) continue;
    const b = bboxOf(m.pos);
    bb = bb ? {min:[Math.min(bb.min[0],b.min[0]),Math.min(bb.min[1],b.min[1]),Math.min(bb.min[2],b.min[2])],
               max:[Math.max(bb.max[0],b.max[0]),Math.max(bb.max[1],b.max[1]),Math.max(bb.max[2],b.max[2])]} : b;
  }
  return bb;
}
function renderMeasure() {
  const el = document.getElementById("measure"); if (!el) return;
  const src = generated ? generated.meshes : previewSolids.filter(m => !m.cut);
  if (!src || !src.length) { el.innerHTML = `<span style="color:var(--faint)">No geometry yet.</span>`; return; }
  let vol = 0;
  for (const m of src) vol += meshVolume(m.pos);
  const bb = unionBox(src);
  const d = DENSITIES[state.material] || 7.85;
  const mass = vol / 1000 * d;                       // mm^3 -> cm^3 -> g
  const sz = bb ? bb.max.map((v,i) => (v - bb.min[i]).toFixed(1)).join(" × ") : "—";
  el.innerHTML =
    `<div>Bounding box <b>${sz}</b> mm</div>` +
    `<div>Volume ≈ <b>${vol.toFixed(1)}</b> mm³</div>` +
    `<div>Mass ≈ <b>${mass.toFixed(2)}</b> g <span style="color:var(--faint)">(${esc(state.material)})</span></div>` +
    (generated ? "" : `<div style="color:var(--warn);margin-top:4px">Layout figures — cuts aren't applied until you Generate.</div>`);
}
function renderDownloads() {
  const el = document.getElementById("downloads"); if (!el) return;
  if (!generated) { el.innerHTML = ""; return; }
  let h = "";
  if (generated.assemblyStep)
    h += dlLink(generated.assemblyStep, "application/step", (state.filename||"model") + ".step", "Assembly .step");
  for (const b of generated.bodies) {

    if (b.stl)  h += dlLink(b.stl,  "model/stl",        b.name + ".stl",  b.name + " .stl");

}
function dlLink(b64, mime, filename, label) {
  const url = URL.createObjectURL(new Blob([b64ToBuf(b64)], {type:mime}));
  return `<a href="${url}" download="${esc(filename)}">${esc(label)}</a>`;
}
function b64ToBuf(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
function bufToB64(buf) {
  // Chunked to avoid blowing the call stack on String.fromCharCode.apply
  // for a large upload (a bare .apply(null, hugeArray) call is a classic
  // "works on my 50KB test file, crashes on a real one" trap).
  const bytes = new Uint8Array(buf);
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);

/* ================================================== GEOMETRY ============== */
function Geo() { return {pos:[], nrm:[]}; }
function tri(g, a, b, c) {
  const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2], vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
  let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
  const l = Math.hypot(nx,ny,nz) || 1; nx/=l; ny/=l; nz/=l;
  g.pos.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2]);
  g.nrm.push(nx,ny,nz, nx,ny,nz, nx,ny,nz);
}
const quad = (g,a,b,c,d) => { tri(g,a,b,c); tri(g,a,c,d); };

function meshBox(l, w, h) {
  const g = Geo(), X=l/2, Y=w/2, Z=h/2;
  const p = [[-X,-Y,-Z],[X,-Y,-Z],[X,Y,-Z],[-X,Y,-Z],[-X,-Y,Z],[X,-Y,Z],[X,Y,Z],[-X,Y,Z]];
  quad(g,p[4],p[5],p[6],p[7]); quad(g,p[1],p[0],p[3],p[2]);
  quad(g,p[0],p[1],p[5],p[4]); quad(g,p[2],p[3],p[7],p[6]);
  quad(g,p[3],p[0],p[4],p[7]); quad(g,p[1],p[2],p[6],p[5]);
  return g;
}
function meshCyl(r, h, seg) {
  seg = seg || 32; const g = Geo(), Z = h/2;
  for (let i = 0; i < seg; i++) {
    const a = i/seg*2*Math.PI, b = (i+1)/seg*2*Math.PI;
    const c1=[Math.cos(a)*r,Math.sin(a)*r], c2=[Math.cos(b)*r,Math.sin(b)*r];
    quad(g, [c1[0],c1[1],-Z],[c2[0],c2[1],-Z],[c2[0],c2[1],Z],[c1[0],c1[1],Z]);
    tri(g, [0,0,Z],[c1[0],c1[1],Z],[c2[0],c2[1],Z]);
    tri(g, [0,0,-Z],[c2[0],c2[1],-Z],[c1[0],c1[1],-Z]);
  }
  return g;
}
function meshTube(ro, ri, h, seg) {
  if (!(ri > 0)) return meshCyl(ro, h, seg);
  seg = seg || 40; const g = Geo(), Z = h/2;
  for (let i = 0; i < seg; i++) {
    const a = i/seg*2*Math.PI, b = (i+1)/seg*2*Math.PI;
    const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);
    quad(g,[ca*ro,sa*ro,-Z],[cb*ro,sb*ro,-Z],[cb*ro,sb*ro,Z],[ca*ro,sa*ro,Z]);   // outer wall (+radial)
    quad(g,[cb*ri,sb*ri,-Z],[ca*ri,sa*ri,-Z],[ca*ri,sa*ri,Z],[cb*ri,sb*ri,Z]);   // inner wall (-radial)
    quad(g,[ca*ro,sa*ro,Z],[cb*ro,sb*ro,Z],[cb*ri,sb*ri,Z],[ca*ri,sa*ri,Z]);     // top ring (+Z)
    quad(g,[cb*ro,sb*ro,-Z],[ca*ro,sa*ro,-Z],[ca*ri,sa*ri,-Z],[cb*ri,sb*ri,-Z]); // bottom ring (-Z)
  }
  return g;
}
/* Ear clipping for a simple polygon (no holes -- holes render as ghosts). */
function triangulate(pts) {
  const n = pts.length; if (n < 3) return [];

  for (let i = 0; i < n; i++) { const j = (i+1)%n; area += pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1]; }
  let V = pts.map((_,i)=>i);
  if (area < 0) V.reverse();
  const out = [];
  let guard = 0;
  while (V.length > 3 && guard++ < 5000) {

      if (f.suppressed) return;
      let geo;
      try { geo = featureGeo(f); } catch (e) { return; }
      const sel = f.id === state.selFeature;
      const isCut = i > 0 && f.mode !== "add";
      const col = hexRgb(isCut ? (f.mode === "subtract" ? "#d4674c" : "#6ea5cf") : body.color);
      for (const pl of featurePlacements(f)) {
        if (geo.solid) {
          const g = applyXform(geo.solid, pl.M, pl.t);
          previewSolids.push({pos:g.pos, nrm:g.nrm, color:col, alpha:isCut?0.28:1.0, sel, cut:isCut});
        }
        for (const v of geo.voids) {
          const g = applyXform(v, pl.M, pl.t);
          previewSolids.push({pos:g.pos, nrm:g.nrm, color:hexRgb("#d4674c"), alpha:0.25, sel, cut:true});

function serializeBodies() {
  return state.bodies
    .filter(b => !b.suppressed && b.features.some(f => !f.suppressed))
    .map(b => ({
      name: b.name, color: b.color, suppressed: false,
      features: b.features.map(f => ({
        type: f.type, params: f.params, position: f.position, rotation: f.rotation,
        mode: f.mode, suppressed: !!f.suppressed,

async function generate() {
  if (!authToken) { document.getElementById("gate").style.display = "flex"; return; }
  const bodies = serializeBodies();
  if (!bodies.length) { status("Nothing to build — every body is empty or suppressed.", "err"); return; }
  const btn = document.getElementById("genBtn");
  btn.disabled = true;
  status("Generating — running OpenCASCADE on the server…", "busy");
  try {
    const resp = await fetch("/api/generate-assembly", {
      method:"POST",
      headers:{"Authorization":"Bearer "+authToken, "Content-Type":"application/json"},
      body: JSON.stringify({bodies, filename: state.filename || "model", stl:true}),
    });
    if (resp.status === 401) {
      sessionStorage.removeItem("cadmcp_token"); authToken = "";
      document.getElementById("gate").style.display = "flex";
      status("Token rejected.", "err"); return;
    }
    const data = await resp.json();
    if (!data.ok) {
      status("Build failed: " + (data.error || "unknown error"), "err");
      console.warn("generate failed:", data);
      return;
    }
    const meshes = [], outBodies = [];
    let failed = 0;
    for (const b of (data.bodies || [])) {
      const src = state.bodies.find(x => x.name === b.name);
      const color = hexRgb((src && src.color) || b.color || "#8fbf9f");
      outBodies.push({name:b.name, step:b.step_base64, stl:b.stl_base64});
      if (!b.ok) { failed++; continue; }
      if (b.stl_base64 && (!src || src.visible)) {
        const m = parseSTL(b64ToBuf(b.stl_base64));
        meshes.push({pos:m.pos, nrm:m.nrm, color, alpha:1.0, sel:false, cut:false});
      }
    }
    generated = {meshes, bodies:outBodies, assemblyStep:data.assembly_step_base64 || null};
    uploadMeshes(meshes);
    renderMeasure(); renderDownloads(); renderLegend();
    const chip = document.getElementById("viewChip");
    chip.className = "chip solid"; chip.textContent = "generated solid";
    let msg = "Generated " + (data.bodies.length - failed) + "/" + data.bodies.length + " body(s).";
    if (failed) msg += " " + failed + " failed — see console.";
    if (data.assembly_error) msg += " Assembly STEP: " + data.assembly_error;

}

function uploadMeshes(list) {
  for (const d of drawList) { gl.deleteBuffer(d.pb); gl.deleteBuffer(d.nb); }
  drawList = [];
  for (const m of (list || [])) {
    if (!m.pos || !m.pos.length) continue;
    const pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.pos), gl.STATIC_DRAW);
    const nb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, nb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.nrm), gl.STATIC_DRAW);
    drawList.push({pb, nb, n:m.pos.length/3, color:m.color, alpha:m.alpha, sel:m.sel});
  }
}
let gridBuf = null, gridN = 0, axisBuf = null;
function buildGrid(span) {
  const step = Math.max(1, Math.pow(10, Math.round(Math.log10(Math.max(span,10)/10))));
  const half = Math.ceil(span/step)*step, v = [];
  for (let x = -half; x <= half; x += step) { v.push(x,-half,0, x,half,0, -half,x,0, half,x,0); }
  if (gridBuf) gl.deleteBuffer(gridBuf);
  gridBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, gridBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(v), gl.STATIC_DRAW);
  gridN = v.length/3;
  const a = half*0.5, av = [0,0,0, a,0,0, 0,0,0, 0,a,0, 0,0,0, 0,0,a];
  if (axisBuf) gl.deleteBuffer(axisBuf);
  axisBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, axisBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(av), gl.STATIC_DRAW);
}
function perspective(fovy, a, n, f) {
  const t = 1/Math.tan(fovy/2), o = new Float32Array(16);
  o[0]=t/a; o[5]=t; o[10]=(f+n)/(n-f); o[11]=-1; o[14]=(2*f*n)/(n-f); return o;
}
function lookAt(eye, c, up) {
  const z = norm3(sub3(eye,c)), x = norm3(cross3(up,z)), y = cross3(z,x), o = new Float32Array(16);
  o[0]=x[0];o[4]=x[1];o[8]=x[2];o[12]=-dot3(x,eye);
  o[1]=y[0];o[5]=y[1];o[9]=y[2];o[13]=-dot3(y,eye);
  o[2]=z[0];o[6]=z[1];o[10]=z[2];o[14]=-dot3(z,eye);
  o[15]=1; return o;
}
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm3=(a)=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};

const eyePos = () => [
  camTarget[0] + camDist*Math.cos(camEl)*Math.sin(camAz),
  camTarget[1] - camDist*Math.cos(camEl)*Math.cos(camAz),
  camTarget[2] + camDist*Math.sin(camEl)];

function setView(v) {
  autoSpin = false; document.getElementById("spinBtn").classList.remove("on");
  const M = {front:[0,0], back:[Math.PI,0], right:[Math.PI/2,0], left:[-Math.PI/2,0],
             top:[0,1.5533], bottom:[0,-1.5533], iso:[-0.785,0.615]};
  if (M[v]) { camAz = M[v][0]; camEl = M[v][1]; }
}
function fitView() {
  const src = generated ? generated.meshes : previewSolids;
  const bb = unionBox(src || []);
  if (!bb) { camDist = 120; camTarget = [0,0,0]; buildGrid(60); return; }
  camTarget = [(bb.min[0]+bb.max[0])/2, (bb.min[1]+bb.max[1])/2, (bb.min[2]+bb.max[2])/2];
  const ext = Math.max(bb.max[0]-bb.min[0], bb.max[1]-bb.min[1], bb.max[2]-bb.min[2], 1);
  camDist = ext * 2.4;
  buildGrid(Math.max(ext*1.6, 10));
}
function toggleGrid() { showGrid = !showGrid; document.getElementById("gridBtn").classList.toggle("on", showGrid); }
function toggleSpin() { autoSpin = !autoSpin; document.getElementById("spinBtn").classList.toggle("on", autoSpin); }

let drag = null;
glc.addEventListener("contextmenu", e => e.preventDefault());
glc.addEventListener("pointerdown", (e) => {
  glc.setPointerCapture(e.pointerId);
  drag = {x:e.clientX, y:e.clientY, pan:(e.button===1 || e.button===2 || e.shiftKey)};
  autoSpin = false; document.getElementById("spinBtn").classList.remove("on");
});
glc.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const fwd = norm3(sub3(camTarget, eyePos()));
    const right = norm3(cross3(fwd, [0,0,1])), up = cross3(right, fwd);
    const k = camDist * 0.0018;
    camTarget = [camTarget[0] - right[0]*dx*k + up[0]*dy*k,
                 camTarget[1] - right[1]*dx*k + up[1]*dy*k,
                 camTarget[2] - right[2]*dx*k + up[2]*dy*k];
  } else {
    camAz += dx * 0.0075;
    camEl = Math.max(-1.553, Math.min(1.553, camEl + dy * 0.0075));
  }
});
glc.addEventListener("pointerup", () => { drag = null; });
glc.addEventListener("wheel", (e) => {
  e.preventDefault();
  camDist = Math.max(2, Math.min(6000, camDist * (1 + e.deltaY*0.0012)));
}, {passive:false});

function resizeGL() {
  const dpr = Math.min(devicePixelRatio || 1, 2), r = glc.parentElement.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width*dpr)), h = Math.max(1, Math.round(r.height*dpr));
  if (glc.width !== w || glc.height !== h) {
    glc.width = w; glc.height = h;
    glc.style.width = r.width+"px"; glc.style.height = r.height+"px";
  }
}
function frame() {
  resizeGL();
  gl.viewport(0, 0, glc.width, glc.height);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (autoSpin) camAz += 0.0022;

  const V = lookAt(eyePos(), camTarget, [0,0,1]);
  const Pj = perspective(Math.PI/5, glc.width/glc.height, Math.max(0.05, camDist/300), camDist*20);
  const NM = new Float32Array([V[0],V[1],V[2], V[4],V[5],V[6], V[8],V[9],V[10]]);

  if (showGrid && gridBuf) {
    gl.useProgram(P_LINE);
    gl.uniformMatrix4fv(L.lV, false, V); gl.uniformMatrix4fv(L.lPr, false, Pj);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER, gridBuf);
    gl.enableVertexAttribArray(L.lP); gl.vertexAttribPointer(L.lP, 3, gl.FLOAT, false, 0, 0);
    gl.uniform3f(L.lC, 1,1,1); gl.uniform1f(L.lA, 0.055);
    gl.drawArrays(gl.LINES, 0, gridN);
    gl.bindBuffer(gl.ARRAY_BUFFER, axisBuf);
    gl.vertexAttribPointer(L.lP, 3, gl.FLOAT, false, 0, 0);
    gl.uniform1f(L.lA, 0.9);
    gl.uniform3f(L.lC, 0.85,0.33,0.28); gl.drawArrays(gl.LINES, 0, 2);
    gl.uniform3f(L.lC, 0.45,0.75,0.42); gl.drawArrays(gl.LINES, 2, 2);
    gl.uniform3f(L.lC, 0.40,0.62,0.88); gl.drawArrays(gl.LINES, 4, 2);
    gl.disable(gl.BLEND);
  }

  gl.useProgram(P_MESH);
  gl.uniformMatrix4fv(L.mV, false, V); gl.uniformMatrix4fv(L.mPr, false, Pj);
  gl.uniformMatrix3fv(L.mNM, false, NM);
  const drawOne = (d) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, d.pb);
    gl.enableVertexAttribArray(L.mP); gl.vertexAttribPointer(L.mP, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, d.nb);
    gl.enableVertexAttribArray(L.mN); gl.vertexAttribPointer(L.mN, 3, gl.FLOAT, false, 0, 0);
    gl.uniform3f(L.mC, d.color[0], d.color[1], d.color[2]);
    gl.uniform1f(L.mA, d.alpha); gl.uniform1f(L.mS, d.sel ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, d.n);
  };
  for (const d of drawList) if (d.alpha >= 1) drawOne(d);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  for (const d of drawList) if (d.alpha < 1) drawOne(d);
  gl.depthMask(true); gl.disable(gl.BLEND);

  requestAnimationFrame(frame);
}

/* ================================================== SKETCHER ============== */
const skc = document.getElementById("skCanvas"), skx = skc.getContext("2d");
let skPts = [], skTool = "select", skSel = -1, skDragIdx = -1, skTemp = null, skTempStart = null;
let skScale = 4, skOx = 0, skOy = 0, skPan = null, skTarget = null, skIsRevolve = false;

function openSketch() {
  const f = curFeature();
  if (!f || (f.type !== "sketch" && f.type !== "revolve")) return;
  skTarget = f; skIsRevolve = f.type === "revolve";
  skPts = parsePts(f.params.points);
  skSel = -1; skTemp = null; skTempStart = null; skDragIdx = -1;
  setTool("select");
  document.getElementById("skTitle").textContent = skIsRevolve ? "Revolve profile" : "Sketch profile";
  document.getElementById("skSub").textContent = skIsRevolve
    ? "Revolved about the Z axis. X = radius (never negative), Y = height."
    : "One closed profile on the XY plane. Click to place points, drag to move, double-click to delete.";
  document.getElementById("skXLabel").textContent = skIsRevolve ? "Radius" : "X";
  document.getElementById("skYLabel").textContent = skIsRevolve ? "Height" : "Y";
  document.getElementById("skModal").classList.add("open");
  requestAnimationFrame(() => { skFit(); skDraw(); });
}
function closeSketch(apply) {
  if (apply) {
    if (skPts.length < 3) { alert("A profile needs at least 3 points."); return; }
    pushUndo();
    skTarget.params.points = skPts.map(p => p[0] + "," + p[1]).join("\n");
    touch(true);
    status("Profile updated (" + skPts.length + " points).");
  }
  document.getElementById("skModal").classList.remove("open");
}
function setTool(t) {
  skTool = t; skTemp = null; skTempStart = null;
  ["select","poly","rect","circle"].forEach(k => document.getElementById("tool-"+k).classList.toggle("on", k===t));
  skc.style.cursor = t === "select" ? "default" : "crosshair";
  skDraw();
}
function skFit() {
  const w = skc.clientWidth, h = skc.clientHeight;
  if (skPts.length) {
    const xs = skPts.map(p=>p[0]), ys = skPts.map(p=>p[1]);
    const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
    skScale = Math.max(0.5, Math.min(40, Math.min(w/((maxx-minx)+20), h/((maxy-miny)+20))));
    skOx = w/2 - ((maxx+minx)/2)*skScale;
    skOy = h/2 + ((maxy+miny)/2)*skScale;
  } else { skScale = 4; skOx = skIsRevolve ? w*0.28 : w/2; skOy = h/2; }
}
const toPx = (x,y) => [skOx + x*skScale, skOy - y*skScale];
const toMm = (px,py) => [(px - skOx)/skScale, (skOy - py)/skScale];
function snap(v) {
  if (!document.getElementById("skSnap").checked) return Math.round(v*100)/100;
  const s = parseFloat(document.getElementById("skStep").value) || 1;
  return Math.round(Math.round(v/s)*s * 100)/100;
}
function skDraw() {
  const w = skc.clientWidth, h = skc.clientHeight, dpr = devicePixelRatio || 1;
  skc.width = Math.max(1, w*dpr); skc.height = Math.max(1, h*dpr);
  skx.setTransform(dpr,0,0,dpr,0,0);
  skx.clearRect(0,0,w,h);

  const step = parseFloat(document.getElementById("skStep").value) || 1;
  let gs = step; while (gs*skScale < 8) gs *= 2;
  skx.lineWidth = 1; skx.strokeStyle = "rgba(255,255,255,.05)";
  const tl = toMm(0,0), br = toMm(w,h);
  skx.beginPath();
  for (let x = Math.floor(br[0]/gs)*gs; x <= tl[0]+gs; x += gs) { const p = toPx(x,0); skx.moveTo(p[0],0); skx.lineTo(p[0],h); }
  for (let y = Math.floor(br[1]/gs)*gs; y <= tl[1]+gs; y += gs) { const p = toPx(0,y); skx.moveTo(0,p[1]); skx.lineTo(w,p[1]); }
  skx.stroke();

  const ox = toPx(0,0)[0], oy = toPx(0,0)[1];
  skx.strokeStyle = "rgba(255,255,255,.22)"; skx.beginPath();
  skx.moveTo(0,oy); skx.lineTo(w,oy); skx.moveTo(ox,0); skx.lineTo(ox,h); skx.stroke();
  if (skIsRevolve) {
    skx.fillStyle = "rgba(212,103,76,.10)"; skx.fillRect(0,0,Math.max(0,ox),h);
    skx.strokeStyle = "rgba(110,165,207,.85)"; skx.setLineDash([6,4]); skx.lineWidth = 2;
    skx.beginPath(); skx.moveTo(ox,0); skx.lineTo(ox,h); skx.stroke(); skx.setLineDash([]);
    skx.fillStyle = "rgba(110,165,207,.9)"; skx.font = "11px ui-monospace,monospace";
    skx.fillText("Z axis", ox+6, 14);
  }

  if (skPts.length) {
    skx.strokeStyle = "#d9a05b"; skx.lineWidth = 2;
    skx.beginPath();
    skPts.forEach((p,i) => { const q = toPx(p[0],p[1]); i ? skx.lineTo(q[0],q[1]) : skx.moveTo(q[0],q[1]); });
    if (skPts.length > 2) {
      skx.closePath();
      skx.fillStyle = "rgba(217,160,91,.10)"; skx.fill();
    }
    skx.stroke();
    skPts.forEach((p,i) => {
      const q = toPx(p[0],p[1]);
      skx.fillStyle = i === skSel ? "#ffffff" : (i === 0 ? "#79b36f" : "#d9a05b");
      skx.beginPath(); skx.arc(q[0],q[1], i===skSel ? 5.5 : 4, 0, 7); skx.fill();
    });
  }
  if (skTemp) {
    skx.strokeStyle = "rgba(217,160,91,.7)"; skx.setLineDash([4,3]); skx.lineWidth = 1.5;
    skx.beginPath();
    skTemp.forEach((p,i) => { const q = toPx(p[0],p[1]); i ? skx.lineTo(q[0],q[1]) : skx.moveTo(q[0],q[1]); });
    skx.closePath(); skx.stroke(); skx.setLineDash([]);
  }

  document.getElementById("skCount").textContent = skPts.length;
  document.getElementById("skPts").innerHTML = skPts.map((p,i) =>
    `<div class="${i===skSel?"sel":""}" onclick="skSelect(${i})">${i}: ${p[0]}, ${p[1]}</div>`).join("") || "(empty)";
  if (skSel >= 0 && skPts[skSel]) {
    document.getElementById("skPX").value = skPts[skSel][0];
    document.getElementById("skPY").value = skPts[skSel][1];
  }
}
function skSelect(i) { skSel = i; skDraw(); }
function skEditPoint() {
  if (skSel < 0 || !skPts[skSel]) return;
  let x = parseFloat(document.getElementById("skPX").value) || 0;
  const y = parseFloat(document.getElementById("skPY").value) || 0;
  if (skIsRevolve) x = Math.max(0, x);
  skPts[skSel] = [x, y]; skDraw();
}
function skDeleteSelected() { if (skSel < 0) return; skPts.splice(skSel,1); skSel = -1; skDraw(); }
function skUndoPoint() { skPts.pop(); skSel = -1; skDraw(); }
function skClear() { skPts = []; skSel = -1; skTemp = null; skDraw(); }
function skHit(px, py) {
  for (let i = 0; i < skPts.length; i++) {
    const q = toPx(skPts[i][0], skPts[i][1]);
    if (Math.hypot(q[0]-px, q[1]-py) < 9) return i;
  }
  return -1;
}
function skLocal(e) { const r = skc.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }

skc.addEventListener("contextmenu", e => e.preventDefault());
skc.addEventListener("pointerdown", (e) => {
  skc.setPointerCapture(e.pointerId);
  const [px,py] = skLocal(e);
  if (e.button === 1 || e.button === 2 || e.shiftKey) { skPan = {x:e.clientX, y:e.clientY}; return; }
  let [mx,my] = toMm(px,py); mx = snap(mx); my = snap(my);
  if (skIsRevolve) mx = Math.max(0, mx);
  if (skTool === "select") { const hit = skHit(px,py); skSel = hit; skDragIdx = hit; skDraw(); return; }
  if (skTool === "poly")   { skPts.push([mx,my]); skSel = skPts.length-1; skDraw(); return; }
  skDragIdx = -2; skTempStart = [mx,my];
});
skc.addEventListener("pointermove", (e) => {
  const [px,py] = skLocal(e);
  let [mx,my] = toMm(px,py);
  document.getElementById("skReadout").textContent =
    (skIsRevolve ? "r " : "X ") + snap(mx).toFixed(2) + (skIsRevolve ? "    z " : "    Y ") + snap(my).toFixed(2);
  if (skPan) { skOx += e.clientX-skPan.x; skOy += e.clientY-skPan.y; skPan = {x:e.clientX,y:e.clientY}; skDraw(); return; }
  mx = snap(mx); my = snap(my);
  if (skIsRevolve) mx = Math.max(0, mx);
  if (skDragIdx >= 0) { skPts[skDragIdx] = [mx,my]; skDraw(); return; }
  if (skDragIdx === -2 && skTempStart) {
    const [sx,sy] = skTempStart;
    if (skTool === "rect") skTemp = [[sx,sy],[mx,sy],[mx,my],[sx,my]];
    else {
      const r = Math.hypot(mx-sx, my-sy), N = 32, pts = [];
      for (let i = 0; i < N; i++) {
        const a = i/N*2*Math.PI;
        let x = sx + Math.cos(a)*r;
        if (skIsRevolve) x = Math.max(0, x);
        pts.push([Math.round(x*100)/100, Math.round((sy+Math.sin(a)*r)*100)/100]);
      }
      skTemp = pts;
    }
    skDraw();
  }
});
skc.addEventListener("pointerup", () => {
  if (skDragIdx === -2 && skTemp && skTemp.length >= 3) {
    skPts = skTemp.slice(); skSel = -1; setTool("select");
  }
  skTemp = null; skTempStart = null; skDragIdx = -1; skPan = null; skDraw();
});
skc.addEventListener("dblclick", (e) => {
  const [px,py] = skLocal(e), hit = skHit(px,py);
  if (hit >= 0) { skPts.splice(hit,1); skSel = -1; skDraw(); }
});
skc.addEventListener("wheel", (e) => {
  e.preventDefault();
  const [px,py] = skLocal(e), before = toMm(px,py);
  skScale = Math.max(0.4, Math.min(90, skScale * (1 - e.deltaY*0.0016)));
  const after = toMm(px,py);
  skOx += (after[0]-before[0])*skScale; skOy -= (after[1]-before[1])*skScale;
  skDraw();
}, {passive:false});

/* ================================================== KEYS / BOOT =========== */
addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName || "");
  const sketchOpen = document.getElementById("skModal").classList.contains("open");
  if (e.ctrlKey && e.key.toLowerCase() === "z" && !typing && !sketchOpen) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === "y" && !typing && !sketchOpen) { e.preventDefault(); redo(); return; }
  if (typing) return;
  if (e.key === "Escape" && sketchOpen) { closeSketch(false); return; }
  if (sketchOpen) return;
  if (e.key === "f" || e.key === "F") fitView();
  if (e.key === "Delete" && curFeature()) deleteFeat(curBody().id, curFeature().id);
});
addEventListener("resize", () => { if (document.getElementById("skModal").classList.contains("open")) skDraw(); });

state = load() || blankDesign();
if (!state.material) state.material = "Steel";
if (!state.filename) state.filename = "model";
renderPalette();
renderAll();
buildGrid(60);
fitView();
refreshUndoBtns();
frame();
status("Add features on the left, edit on the right, then Generate for the real solid.");
</script>
